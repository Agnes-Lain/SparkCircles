name: Mobile

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [ main ]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"

defaults:
  run:
    working-directory: mobile

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      # Only needed so the app bundles; the tests never call a real server.
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint, no hard-coded colors, Prettier)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Package versions match Expo SDK 57
        run: npm run deps:check

      - name: Tests
        run: npm test -- --ci

      - name: Bundle smoke test (Android)
        run: npx expo export --platform android --output-dir ../tmp-mobile-export
