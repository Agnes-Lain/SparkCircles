        one: "%{count} cercle signalé"
        other: "%{count} cercles signalés"
  api:
    errors:
      admin_rights_paused: "Tes droits d'admin sont en pause. Vérifie à nouveau ton identité pour gérer le cercle."
      circle_create_limit: "Tu peux créer 3 cercles et tu en as déjà 3."
      circle_member_limit: "Tu fais déjà partie de 5 cercles, c'est le maximum. Quitte un cercle pour en rejoindre un autre."
      circle_full: "Ce cercle est complet."
      already_member: "Tu fais déjà partie de ce cercle."
      sole_admin: "Tu es la seule personne admin. Nomme un membre vérifié admin, puis tu pourras quitter le cercle."
      admin_limit: "3 admins au maximum."
      already_admin: "Ce membre est déjà admin."
      member_is_admin: "Une personne admin ne peut pas être retirée. Elle peut d'abord quitter son rôle."
      member_is_creator: "La personne qui a créé le cercle ne peut pas être retirée."
      not_verified_member: "Seul un membre vérifié peut devenir admin."
      circle_has_verified_members: "D'autres membres vérifiés peuvent animer ce cercle : nomme plutôt l'un d'eux admin."
      requester_at_limit: "Cette personne fait déjà partie de 5 cercles, c'est le maximum."
      invitation_invalid: "Cette invitation n'est plus valide. Demande à la personne qui t'a envoyé l'invitation."
      too_many_tries: "Trop d'essais. Réessaie dans quelques minutes."
      circle_paused: "Ce cercle est en pause."
