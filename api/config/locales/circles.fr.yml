      circle_membership_removed: "Tu ne fais plus partie de ce cercle."
  circles:
    report_reasons:
      unsafe: "Dangereux ou inapproprié"
      not_real_group: "Pas un vrai groupe"
      inappropriate_behaviour: "Comportement inapproprié"
      child_safety: "Inquiétude pour la sécurité des enfants"
      fake_identity: "Fausse identité"
      other: "Autre"
  activerecord:
    errors:
      messages:
        not_allowed: "n'est pas autorisé ici"
        verification_required: "demande une identité vérifiée"
        forced_private: "reste privé tant que SparkCircles ne lève pas la mesure"
  circle_mailer:
    request_received:
      subject: "Nouvelle demande pour « %{name} »"
      lines:
        - "%{person} demande à rejoindre « %{name} »."
        - "Ouvre le cercle pour accepter ou refuser. Aucun motif n'est envoyé si tu refuses."
      action: "Voir la demande"
    requests_digest:
      subject:
        one: "1 nouvelle demande pour « %{name} »"
        other: "%{count} nouvelles demandes pour « %{name} »"
      lines:
        - "De nouvelles demandes attendent dans « %{name} »."
        - "Ouvre le cercle pour accepter ou refuser. Aucun motif n'est envoyé si tu refuses."
      action: "Voir les demandes"
    request_accepted:
      subject: "Tu es dans le cercle « %{name} »"
      lines:
        - "Ta demande a été acceptée : tu fais maintenant partie de « %{name} »."
        - "Tu peux voir ses membres et ses sorties dans l'app."
      action: "Ouvrir le cercle"
    request_declined:
      subject: "Ta demande pour « %{name} »"
      lines:
        - "Ta demande pour rejoindre « %{name} » n'a pas été acceptée."
      action: "Voir mes cercles"
    request_expired:
      subject: "Ta demande pour « %{name} » a expiré"
      lines:
        - "Ta demande pour rejoindre « %{name} » a expiré. Tu peux redemander."
        - "Réutilise le lien ou le code."
      action: "Voir mes cercles"
    event_access_lost:
      subject: "Tu ne peux plus participer à « %{title} »"
      left: "Tu ne peux plus participer à « %{title} » : tu as quitté le cercle."
      removed: "Tu ne peux plus participer à « %{title} » : tu ne fais plus partie du cercle."
      action: "Voir les sorties"
    new_admin:
      subject: "Tu es maintenant admin de « %{name} »"
      lines:
        closed_account:
          - "La personne admin de « %{name} » a fermé son compte. Tu fais partie des membres vérifiés depuis le plus longtemps : tu es maintenant admin du cercle."
          - "Tu peux accepter les demandes, renouveler le lien et gérer le cercle. Tu peux aussi nommer un autre admin."
        no_verified_admin:
          - "« %{name} » n’avait plus de personne admin vérifiée. Ton compte est vérifié : tu es maintenant admin du cercle."
          - "Tu peux accepter les demandes, renouveler le lien et gérer le cercle. Tu peux aussi nommer un autre admin."
      action: "Ouvrir le cercle"
    circle_closing:
      subject: "« %{name} » va fermer"
      lines:
        - "« %{name} » n'a plus de membre vérifié pour l'animer. Il fermera le %{date}."
        - "D'ici là, tu peux toujours le voir dans l'app."
      action: "Voir mes cercles"
